name: Build BasaraPortStable (app)

# Fast build: reuses the published native core (libmain.so, libbasara_disc.so and the runtime
# assets) and compiles only the Android app, so it needs no game files. Use this for changes in
# app/ (menu, settings, touch controls, device profiles). Native changes need the "native"
# workflow, which recompiles the game from your own disc.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  # The published APK whose native core is reused. Set the BASARA_BASE_APK_URL repository variable
  # to another release if the app starts needing a newer runtime.
  BASE_APK_URL: ${{ vars.BASARA_BASE_APK_URL || 'https://github.com/PotatoRecomp/B2HWii-Android/releases/download/v1.2.1-hotfix/basara2heroes-1.2.1-hotfix-android-arm64.apk' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Stage the native core
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o base.apk "$BASE_APK_URL"
          rm -rf base
          unzip -q base.apk 'lib/arm64-v8a/*' 'assets/runtime/*' -d base
          libs=generated/android-native/jniLibs/arm64-v8a
          mkdir -p "$libs" generated/android-native/assets
          cp base/lib/arm64-v8a/*.so "$libs"/
          cp -a base/assets/runtime generated/android-native/assets/
          for required in libmain.so libbasara_disc.so; do
            test -f "$libs/$required" || { echo "missing $required in the base APK"; exit 1; }
          done
          du -sh "$libs" generated/android-native/assets/runtime

      - name: Stage signing keystore
        env:
          B64: ${{ secrets.BASARA_KEYSTORE_BASE64 }}
          PASS: ${{ secrets.BASARA_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.BASARA_KEY_ALIAS }}
          KEYPASS: ${{ secrets.BASARA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${B64:-}" ]; then
            echo "No signing keystore secret set; building debug-signed."
            exit 0
          fi
          echo "$B64" | base64 -d > "$RUNNER_TEMP/basara-release.jks"
          {
            echo "BASARA_KEYSTORE=$RUNNER_TEMP/basara-release.jks"
            echo "BASARA_KEYSTORE_PASSWORD=$PASS"
            echo "BASARA_KEY_ALIAS=$ALIAS"
            echo "BASARA_KEY_PASSWORD=$KEYPASS"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: app
        run: >
          gradle assembleRelease
          "-PbasaraVersionName=1.2.3-stable"
          "-PbasaraVersionCode=52"
          --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BasaraPortStable-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release with APK
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          sha256sum "$apk" > "$apk.sha256"
          tag="v1.2.3-stable"
          title="BasaraPortStable 1.2.3-stable (build ${{ github.run_number }})"
          # Re-create the tag/release for this build so the APK stays current.
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" "$apk" "$apk.sha256" \
            --title "$title" --notes "Signed APK (release keystore). SHA-256 in the .sha256 file." \
            --prerelease 2>&1 | tail -5
